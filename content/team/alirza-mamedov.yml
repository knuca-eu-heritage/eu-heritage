bio:
  uk: Спеціалізується на територіальному та міському плануванні й регенерації. Викладає модуль про досвід ЄС у плануванні на основі спадщини та відповідає за сайт проєкту.
  en: Specialises in territorial and city-level planning and regeneration. Teaches the module on EU experience in heritage-based planning and leads the project website.
