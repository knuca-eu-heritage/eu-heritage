bio:
  uk: Спеціалізується на територіальному та міському плануванні й регенерації.
    Викладає модуль про європейські рамки просторового планування та досвід
    держав-членів ЄС. Відповідає за сайт проєкту.
  en: Specialises in territorial and urban planning and regeneration. Teaches the
    module on European frameworks for spatial planning and on EU Member State
    experience. Responsible for the project website.
