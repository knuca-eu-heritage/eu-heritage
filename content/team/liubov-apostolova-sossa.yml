name:
  uk: Любов Апостолова-Сосса
  en: Liubov Apostolova-Sossa
role:
  uk: Викладачка модуля; завідувачка кафедри міського господарства, доцентка
  en: Module lecturer; Head of the Department of Urban Economy, Associate Professor
bio:
  uk: Фахівчиня з управління культурною спадщиною, партисипативного врядування та
    адаптивного використання історичних будівель; членкиня ICOMOS Україна.
    Викладає модуль про європейські підходи до управління спадщиною. Відповідає
    за вебінари, конференції та відкриті матеріали.
  en: Specialises in cultural heritage governance, participatory governance and
    adaptive reuse of historic buildings; member of ICOMOS Ukraine. Teaches the
    module on European approaches to heritage governance. Responsible for the
    webinars, conferences and open-access materials.
