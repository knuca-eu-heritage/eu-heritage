bio:
  uk: Спеціалізується на врядуванні ЄС, політиці інклюзії та гендерної рівності.
    Координує реалізацію проєкту, відповідає за силабус курсу, оцінювання та
    звітність. Викладає модуль про цінності ЄС, гендерний мейнстрімінг і
    партисипативні підходи в урбаністичній політиці.
  en: Specialises in EU governance, inclusion and gender equality policy.
    Coordinates the implementation of the project and is responsible for the
    course syllabus, assessment and reporting. Teaches the module on EU values,
    gender mainstreaming and participatory approaches in urban policy.
