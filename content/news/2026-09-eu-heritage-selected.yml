url: eu-heritage-selected
date: 2026-09-25
title:
  uk: КНУБА реалізовуватиме модуль Жана Моне EU-HERITAGE
  en: KNUBA to run the EU-HERITAGE Jean Monnet Module
summary:
  uk: Проєкт «Підходи ЄС до містобудівного планування та регенерації на основі культурної спадщини» отримав підтримку програми Erasmus+.
  en: The project "EU Approaches to Heritage-Based Urban Planning and Regeneration" has received Erasmus+ support.
image: ""
image_alt: { uk: "", en: "" }
body:
  uk: |
    Європейське виконавче агентство з питань освіти та культури (EACEA) підтримало модуль Жана Моне EU-HERITAGE, підготовлений командою факультету урбаністики та просторового планування КНУБА.

    Протягом трьох років курс пройдуть щонайменше 150 студентів, а відкриті вебінари й щорічні конференції зберуть понад 200 зовнішніх учасників. Перший навчальний цикл розпочнеться у весняному семестрі 2027 року.
  en: |
    The European Education and Culture Executive Agency (EACEA) has supported EU-HERITAGE, a Jean Monnet Module prepared by the Faculty of Urbanism and Spatial Planning at KNUBA.

    Over three years at least 150 students will take the course, and open webinars and annual conferences will reach more than 200 external participants. The first teaching cycle starts in the spring semester of 2027.
