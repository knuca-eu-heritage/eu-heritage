title:
  uk: Про проєкт
  en: About the project
lede:
  uk: EU-HERITAGE — модуль Жан Моне програми Erasmus+, що впроваджується в КНУБА
    протягом 36 місяців. Модуль присвячений європейським підходам до планування
    та регенерації міст на основі культурної спадщини.
  en: EU-HERITAGE is an Erasmus+ Jean Monnet Module implemented at KNUCA over 36
    months. It focuses on European approaches to heritage-based urban planning
    and regeneration.
body:
  uk: >-
    Повоєнна відбудова України та статус кандидата на вступ до ЄС створюють
    потребу у фахівцях з містобудування, які розуміють європейські підходи до
    врядування та збереження культурної спадщини. Водночас програми підготовки
    містобудівників традиційно зосереджені на проєктних та інженерних
    компетентностях, а зміст, пов'язаний із політиками ЄС, у них майже
    відсутній.


    Модуль заповнює цю прогалину. Він поєднує теоретичні засади з прикладним
    навчанням на прикладах держав-членів ЄС і приділяє особливу увагу
    інклюзивному плануванню: потребам жінок з дітьми, людей старшого віку, людей
    з інвалідністю та інших вразливих груп, що особливо важливо з огляду на
    демографічні зміни, спричинені війною.


    Кожен студент готує аналітичну записку (policy brief), у якій застосовує
    рамки ЄС до конкретного українського випадку. Найкращі роботи публікуються у
    відкритій серії Policy Brief Series.


    Модуль виходить за межі аудиторії: вебінари за участі дослідників з країн ЄС
    та щорічні конференції відкриті для практиків, представників органів
    місцевого самоврядування, фахівців зі спадщини та всіх охочих.


    Результати проєкту, зокрема навчальний пакет, доступні для повторного
    використання іншими закладами за ліцензією CC BY.
  en: >+
    Ukraine's post-war reconstruction and its status as an EU candidate country
    have created a need for urban planning professionals who understand European
    approaches to governance and heritage conservation. Yet urban planning
    curricula have traditionally focused on design and engineering competencies,
    with little content related to EU policy.


    The Module addresses this gap. It combines conceptual foundations with
    applied learning based on cases from EU Member States, with particular
    attention to inclusive planning — the needs of women with children, older
    people, persons with disabilities and other vulnerable groups — which is
    especially relevant given the demographic changes brought about by the war.


    Each student produces a policy brief applying EU frameworks to a specific
    Ukrainian case. The best work is published in the open-access Policy Brief
    Series.


    The Module reaches beyond the classroom: webinars with researchers from EU
    countries and annual conferences are open to practitioners, municipal
    officials, heritage professionals and the wider public. 


    Project outputs, including the teaching package, are available for reuse by
    other institutions under a CC BY licence.









objectives_title:
  uk: Цілі модуля
  en: Objectives
objectives:
  - uk: Сформувати в студентів розуміння політик ЄС у сфері планування та
      регенерації на основі спадщини.
    en: "Develop students' EU policy literacy in heritage-based urban planning and
      regeneration. "
  - uk: Розвинути компетентності в партисипативному та інклюзивному плануванні.
    en: Build competence in participatory and inclusive planning approaches.
  - uk: "Залучити практиків, представників органів місцевого самоврядування та
      широку аудиторію через вебінари і конференції. "
    en: "Reach practitioners, municipal officials and the public through webinars
      and conferences. "
  - uk: Створити практично корисні результати, зокрема студентські аналітичні
      записки та відкриті ресурси, що підтримують наближення України до ЄС.
    en: Generate policy-relevant outputs, including student policy briefs and
      open-access resources, that support Ukraine's EU approximation.
