title:
  uk: Про проєкт
  en: About the project
lede:
  uk: EU-HERITAGE — модуль Жана Моне програми Erasmus+, що впроваджується в КНУБА протягом 36 місяців.
  en: EU-HERITAGE is an Erasmus+ Jean Monnet Module implemented at KNUBA over 36 months.
body:
  uk: |
    Післявоєнна відбудова України та статус кандидата на вступ до ЄС створюють потребу у фахівцях з містобудування, які розуміють європейські підходи до врядування. Водночас програми підготовки містобудівників традиційно зосереджені на проєктних та інженерних компетентностях, а зміст, пов'язаний із політиками ЄС, у них майже відсутній.

    Модуль заповнює цю прогалину. Він поєднує теоретичні засади з прикладним навчанням на прикладах держав-членів ЄС і приділяє особливу увагу інклюзивному плануванню: потребам жінок з дітьми, людей старшого віку, людей з інвалідністю та інших вразливих груп, що особливо важливо з огляду на демографічні зміни, спричинені війною.

    Кожен студент готує policy brief, у якому застосовує рамки ЄС до конкретного українського випадку. Найкращі роботи публікуються у відкритій серії Policy Brief Series. Усі результати проєкту, зокрема навчальний пакет, доступні для повторного використання іншими закладами за ліцензією CC BY.
  en: |
    Ukraine's post-war reconstruction and EU candidate status create an urgent demand for urban planning professionals who understand European Union governance frameworks. Yet urban planning curricula typically prioritise design and engineering competencies, while EU approaches and policy content remain largely absent.

    The Module addresses this gap. It combines theoretical foundations with applied learning through EU Member State case studies, with particular attention to inclusive planning: the needs of women with children, older people, persons with disabilities and other vulnerable groups, which is critical given war-related demographic change.

    Each student writes a policy brief applying EU frameworks to a specific Ukrainian case. The best briefs are published in the open-access Policy Brief Series. All outputs, including the teaching package, are available for reuse by other institutions under a CC BY licence.
objectives_title:
  uk: Цілі модуля
  en: Objectives
objectives:
  - uk: Сформувати в студентів розуміння політик ЄС у сфері планування та регенерації на основі спадщини (не менше 150 студентів за три роки).
    en: Develop students' EU policy literacy in heritage-based urban planning and regeneration (at least 150 students over three years).
  - uk: Розвинути компетентності в партисипативному та інклюзивному плануванні.
    en: Build competence in participatory and inclusive planning approaches.
  - uk: Залучити практиків, посадовців громад і широку аудиторію через вебінари та конференції (понад 200 зовнішніх учасників).
    en: Reach practitioners, municipal officials and the public through webinars and conferences (more than 200 external participants).
  - uk: Створювати практично корисні результати, зокрема студентські policy briefs і відкриті ресурси, що підтримують наближення України до ЄС.
    en: Generate policy-relevant outputs, including student policy briefs and open-access resources, that support Ukraine's EU approximation.
