title:
  uk: Відкриті ресурси
  en: Open resources
lede:
  uk: Навчальні матеріали, записи, матеріали конференцій і ключові документи, якими можуть користуватися інші викладачі та практики.
  en: Teaching materials, recordings, proceedings and key documents that other educators and practitioners are free to reuse.
body:
  uk: |
    Матеріали проєкту поширюються за ліцензією CC BY 4.0: їх можна копіювати, адаптувати й використовувати в навчанні за умови зазначення авторства. Остаточні версії документів також зберігаються в інституційному репозитарії КНУБА.
  en: |
    Project materials are shared under CC BY 4.0: you may copy, adapt and use them in teaching as long as you credit the authors. Final versions are also deposited in KNUBA's institutional repository.
