title:
  uk: Policy Brief Series
  en: Policy Brief Series
lede:
  uk: Короткі аналітичні записки студентів, у яких рамки ЄС застосовано до конкретних українських міст і громад.
  en: Short policy papers by students applying EU frameworks to specific Ukrainian cities and communities.
body:
  uk: |
    Кожен студент курсу готує policy brief обсягом 2–3 сторінки. Щороку викладацька команда відбирає 15–20 найкращих робіт для чергового випуску серії, а авторів найсильніших брифів відзначає сертифікатами Student Policy Brief Award. Усі матеріали доступні за ліцензією CC BY 4.0.
  en: |
    Every student on the course writes a 2–3 page policy brief. Each year the teaching team selects 15–20 of the best for a new issue of the series, and the authors of the strongest briefs receive a Student Policy Brief Award certificate. All materials are available under CC BY 4.0.
