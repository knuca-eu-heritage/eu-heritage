title:
  uk: Політика конфіденційності
  en: Privacy policy
lede:
  uk: Як сайт EU-HERITAGE поводиться з персональними даними.
  en: How the EU-HERITAGE website handles personal data.
body:
  uk: |
    **Сам сайт не збирає персональних даних.** Він не використовує файлів cookie, систем аналітики чи сторонніх шрифтів: усі шрифти завантажуються з нашого власного сервера.

    **Реєстрація на події та розсилка** здійснюються через зовнішні форми, посилання на які наведено на сторінках подій. Дані, які ви вводите у ці форми (ім'я, електронна пошта, організація), використовуються лише для організації заходу, звітування перед Європейською Комісією про кількість і склад учасників та надсилання вам інформації про проєкт. Ми не передаємо їх третім особам для інших цілей.

    **Записи вебінарів і фотографії** з заходів можуть публікуватися на сайті. Про запис попереджаємо на початку кожного заходу.

    **Ваші права.** Ви можете запросити доступ до своїх даних, їх виправлення або видалення, написавши на адресу, вказану на сторінці «Контакти».

    Відповідальна організація: Київський національний університет будівництва і архітектури.
  en: |
    **The website itself does not collect personal data.** It uses no cookies, analytics or third-party fonts: all fonts are served from our own server.

    **Event registration and the mailing list** use external forms linked from the event pages. The data you enter (name, email, organisation) is used only to organise the event, to report participant numbers and profiles to the European Commission, and to send you information about the project. We do not share it with third parties for any other purpose.

    **Webinar recordings and event photographs** may be published on this website. We announce recording at the start of each event.

    **Your rights.** You can request access to, correction or deletion of your data by writing to the address on the Contact page.

    Controller: Kyiv National University of Construction and Architecture.
