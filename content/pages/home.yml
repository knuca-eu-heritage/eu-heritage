lede:
  uk: Вибірковий курс на 3 кредити ЄКТС для студентів-містобудівників, відкриті вебінари та щорічні конференції про те, як рамки Європейського Союзу допомагають відновлювати історичні міста України.
  en: A 3 ECTS elective course for urban planning students, open webinars and annual conferences on how European Union frameworks can guide the recovery of Ukraine's historic cities.
