body:
  uk: "Курс побудовано за логікою від загального до конкретного: від цінностей і
    політик ЄС через рамки планування та регенерації до управління спадщиною на
    рівні окремих пам'яток і громад. Завершується він презентаціями
    індивідуальних аналітичних записок."
  en: "The course moves from the general to the specific: from EU values and
    policies, through planning and regeneration frameworks, to heritage
    governance at site and community level. It concludes with presentations of
    individual policy briefs."
modules:
  - title:
      uk: "Модуль 1. Рамка міської політики ЄС: цінності, інклюзія та участь"
      en: "Module 1. EU Urban Policy Framework: Values, Inclusion, and Participation"
    sessions: 4
    hours: 8
    lead:
      uk: Надія Гербут
      en: Nadiia Herbut
    description:
      uk: Цінності ЄС (стаття 2 ДЄС) і демократичне врядування як основа міської
        політики; інституції ЄС; гендерний мейнстримінг; інклюзивний розвиток
        міст; New European Bauhaus; зобов'язання України як кандидата на вступ.
      en: EU values (Article 2 TEU) and democratic governance as foundations of urban
        policy; EU institutions; gender mainstreaming; inclusive urban
        development; the New European Bauhaus; Ukraine's obligations as a
        candidate country.
  - title:
      uk: "Модуль 2. Планування та регенерація на основі культурної спадщини: досвід
        ЄС"
      en: "Module 2. Heritage-Based Urban Planning and Regeneration: EU Experience"
    sessions: 5
    hours: 10
    lead:
      uk: Алірза Мамедов
      en: Alirza Mamedov
    description:
      uk: Територіальний порядок денний 2030 і Нова Лейпцизька хартія; підходи ЄС до
        просторового планування з урахуванням спадщини; охорона спадщини в
        містобудівній документації; кейси з держав-членів ЄС.
      en: The Territorial Agenda 2030 and the New Leipzig Charter; EU approaches to
        heritage-sensitive spatial planning; heritage protection in planning
        documentation; case studies from EU Member States.
  - title:
      uk: "Модуль 3. Міська культурна спадщина: підходи ЄС до управління та
        регенерації"
      en: "Module 3. Urban Cultural Heritage: EU Approaches to Management and
        Regeneration"
    sessions: 7
    hours: 14
    lead:
      uk: Любов Апостолова-Сосса
      en: Liubov Apostolova-Sossa
    description:
      uk: Рамка дій ЄС у сфері культурної спадщини; Конвенція Фаро; принципи якості
        ICOMOS для втручань, що фінансуються ЄС; методи залучення стейкхолдерів;
        партисипативні інструменти та проєктування консультацій; збереження
        історичного ландшафту; адаптивне повторне використання історичних
        будівель.
      en: The EU Framework for Action on Cultural Heritage; the Faro Convention;
        ICOMOS Quality Principles for EU-funded interventions; stakeholder
        engagement methods; historic landscape preservation; adaptive reuse of
        heritage buildings.
  - title:
      uk: Підсумкові презентації та оцінювання
      en: Final presentations and assessment
    sessions: 2
    hours: 4
    lead:
      uk: Надія Гербут і викладацька команда
      en: Nadiia Herbut and the teaching team
    description:
      uk: "Студенти представляють індивідуальні policy brief (5–7 хвилин) і отримують
        зворотний зв'язок від викладацької команди та однокурсників. Оцінювання
        за рубрикою: релевантність ЄС, використання доказів, реалістичність,
        інклюзивність, чіткість викладу."
      en: "Students present their individual policy briefs (5–7 minutes) and receive
        feedback from the teaching team and peers. Assessment follows a rubric:
        EU relevance, evidence use, feasibility, inclusiveness and clarity."
