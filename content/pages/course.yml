title:
  uk: Навчальний курс «Підходи ЄС до містопланування та міської регенерації на
    основі культурної спадщини»
  en: The course "EU Approaches to Heritage-Based Urban Planning and Regeneration"
lede:
  uk: Вибіркова дисципліна для студентів бакалаврату й магістратури освітніх
    програм «Міське будівництво та господарство» й «Урбаністика та просторове
    планування»
  en: An elective course for Bachelor's and Master's students in urban planning
    and spatial development
facts:
  - label:
      uk: Обсяг
      en: Workload
    value:
      uk: 3 кредити ЄКТС
      en: 3 ECTS
  - label:
      uk: Семестр
      en: Semester
    value:
      uk: "Весняний "
      en: "Spring "
